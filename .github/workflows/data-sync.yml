# Data Sync from website-data Repository
#
# This workflow receives dispatch events from website-data when PRs with
# data changes are created, updated, or closed. It creates/updates a
# corresponding branch and PR in this repository.
#
# See website-data/docs/AUTOMATION.md for full documentation.
#
# Required secrets:
#   DATA_REPO_TOKEN - PAT with repo access to TVLSI/website-data (for commenting on source PR)

name: Data Sync

run-name: "Data Sync #${{ github.event.client_payload.pr_number }}: ${{ github.event.client_payload.pr_title }}"

on:
  repository_dispatch:
    types: [data-pr-sync]

# Grant necessary permissions for creating branches and PRs
permissions:
  contents: write
  pull-requests: write

env:
  DATA_REPO: TVLSI/website-data
  DATA_BRANCH: ${{ github.event.client_payload.branch }}
  SOURCE_PR: ${{ github.event.client_payload.pr_number }}
  TARGET_BRANCH: data/${{ github.event.client_payload.branch }}

jobs:
  # Log the incoming dispatch event for debugging
  log-event:
    runs-on: ubuntu-latest
    steps:
      - name: Log dispatch payload
        run: |
          echo "=== Data Sync Triggered ==="
          echo "Action: ${{ github.event.client_payload.action }}"
          echo "Source PR: #${{ github.event.client_payload.pr_number }}"
          echo "Source Branch: ${{ github.event.client_payload.branch }}"
          echo "Source SHA: ${{ github.event.client_payload.sha }}"
          echo "Sender: ${{ github.event.client_payload.sender }}"
          echo "Target Branch: data/${{ github.event.client_payload.branch }}"
          echo "=========================="

  # Handle PR opened or updated - create/update branch and PR
  sync-pr:
    runs-on: ubuntu-latest
    needs: log-event
    if: github.event.client_payload.action == 'opened' || github.event.client_payload.action == 'updated'
    
    steps:
      - name: Checkout Website repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create or checkout target branch
        run: |
          echo "Target branch: ${{ env.TARGET_BRANCH }}"
          
          # Check if branch exists remotely
          if git ls-remote --exit-code --heads origin ${{ env.TARGET_BRANCH }}; then
            echo "✓ Branch exists, checking out and resetting to main"
            git fetch origin ${{ env.TARGET_BRANCH }}
            git checkout ${{ env.TARGET_BRANCH }}
            git reset --hard origin/main
          else
            echo "✓ Creating new branch from main"
            git checkout -b ${{ env.TARGET_BRANCH }}
          fi

      - name: Create marker file for website-data branch reference
        id: commit
        run: |
          # Create a marker file that tells build workflows which website-data branch to use
          echo "TVLSI/website-data@${{ env.DATA_BRANCH }}" > .use-tvlsi-data
          echo "✓ Created .use-tvlsi-data pointing to branch: ${{ env.DATA_BRANCH }}"
          
          # Use -f to force add in case .gitignore has this file (it shouldn't, but just in case)
          git add -f .use-tvlsi-data
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Link to website-data PR #${{ env.SOURCE_PR }} (branch: ${{ env.DATA_BRANCH }})"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Push branch
        run: |
          git push -u origin ${{ env.TARGET_BRANCH }} --force
          echo "✓ Pushed branch ${{ env.TARGET_BRANCH }}"

      - name: Check for existing PR
        id: check-pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${{ env.TARGET_BRANCH }}`,
              state: 'open'
            });
            
            if (prs.length > 0) {
              console.log(`Found existing PR: #${prs[0].number}`);
              return { exists: true, number: prs[0].number };
            }
            console.log('No existing PR found');
            return { exists: false, number: null };
          result-encoding: json

      - name: Create PR if needed
        id: create-pr
        if: fromJson(steps.check-pr.outputs.result).exists == false
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Data: ${{ github.event.client_payload.pr_title }}`,
              body: `This PR is linked to [website-data PR #${{ env.SOURCE_PR }}](https://github.com/${{ env.DATA_REPO }}/pull/${{ env.SOURCE_PR }}).
            
            ---
            
            **Source:** \`${{ env.DATA_REPO }}\` branch \`${{ env.DATA_BRANCH }}\`
            **Triggered by:** @${{ github.event.client_payload.sender }}
            
            > ⚠️ **Do not merge this PR directly.** Merge the source PR in website-data instead.
            > This PR will be automatically merged when the source PR is merged.
            
            ---
            
            ### Available Commands
            
            **👉 [Go to website-data PR #${{ env.SOURCE_PR }}](https://github.com/${{ env.DATA_REPO }}/pull/${{ env.SOURCE_PR }})** to run commands:
            
            | Command | Description |
            |---------|-------------|
            | \`&#47;preview\` | Build and deploy to GitHub Pages for review |
            | \`&#47;deploy\` | Mark for production deployment on merge |
            
            > **Note:** Data generation happens during preview/deploy, not in this PR.
            `,
              head: '${{ env.TARGET_BRANCH }}',
              base: 'main'
            });
            
            console.log(`Created PR #${pr.data.number}`);
            return pr.data.number;

      - name: Get PR number
        id: get-pr-number
        run: |
          if [ "${{ fromJson(steps.check-pr.outputs.result).exists }}" == "true" ]; then
            echo "pr_number=${{ fromJson(steps.check-pr.outputs.result).number }}" >> $GITHUB_OUTPUT
          else
            echo "pr_number=${{ steps.create-pr.outputs.result }}" >> $GITHUB_OUTPUT
          fi

      - name: Add deployment instructions comment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const prNumber = parseInt('${{ steps.get-pr-number.outputs.pr_number }}');
            const sourceRepo = '${{ env.DATA_REPO }}';
            const sourcePRNumber = '${{ env.SOURCE_PR }}';
            
            const comment = '📊 **Data Sync PR from ' + sourceRepo + '#' + sourcePRNumber + '**\n\nThis PR contains data changes and requires data generation before deployment. Use the `/deploy` command to trigger the deployment.\n\nFor status updates, use `/status`';
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: comment
            });

      - name: Comment on source PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DATA_REPO_TOKEN }}
          script: |
            const prNumber = '${{ steps.get-pr-number.outputs.pr_number }}';
            const action = '${{ github.event.client_payload.action }}';
            const isNew = action === 'opened';
            
            const body = isNew 
              ? `🔗 **Website PR Created**
            
            A corresponding PR has been created in the Website repository:
            **[TVLSI/website#${prNumber}](https://github.com/TVLSI/website/pull/${prNumber})**
            
            ### Available Commands
            Comment on this PR (website-data) to run:
            - \`&#47;preview\` - Build and deploy a preview to GitHub Pages
            - \`&#47;deploy\` - Mark for production deployment on merge
            - \`&#47;status\` - Check current preview/deploy status
            
            > **Note:** Merge this PR to trigger auto-merge of the Website PR.`
              : `🔄 **Website PR Updated**
            
            The Website PR branch has been updated:
            **[TVLSI/website#${prNumber}](https://github.com/TVLSI/website/pull/${prNumber})**`;
            
            await github.rest.issues.createComment({
              owner: '${{ env.DATA_REPO }}'.split('/')[0],
              repo: '${{ env.DATA_REPO }}'.split('/')[1],
              issue_number: ${{ env.SOURCE_PR }},
              body: body
            });

  # Handle PR merged - check for deploy label and trigger deployment
  handle-merge:
    runs-on: ubuntu-latest
    needs: log-event
    if: github.event.client_payload.action == 'merged'
    
    outputs:
      has_deploy_label: ${{ steps.check-label.outputs.has_deploy_label }}
      pr_number: ${{ steps.find-pr.outputs.pr_number }}
      pr_branch: ${{ steps.find-pr.outputs.pr_branch }}
    
    steps:
      - name: Find corresponding Website PR
        id: find-pr
        uses: actions/github-script@v7
        with:
          script: |
            const targetBranch = 'data/${{ github.event.client_payload.branch }}';
            
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${targetBranch}`,
              state: 'open'
            });
            
            if (prs.length === 0) {
              console.log('No open PR found for branch: ' + targetBranch);
              core.setOutput('pr_number', '');
              core.setOutput('pr_branch', '');
              return null;
            }
            
            const pr = prs[0];
            console.log(`Found Website PR #${pr.number} on branch ${pr.head.ref}`);
            core.setOutput('pr_number', pr.number);
            core.setOutput('pr_branch', pr.head.ref);
            return { number: pr.number, branch: pr.head.ref };

      - name: Check for deploy label on source PR
        id: check-label
        if: steps.find-pr.outputs.pr_number
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DATA_REPO_TOKEN }}
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: '${{ env.DATA_REPO }}'.split('/')[0],
              repo: '${{ env.DATA_REPO }}'.split('/')[1],
              pull_number: ${{ env.SOURCE_PR }}
            });
            
            const hasDeployLabel = pr.labels.some(label => label.name === 'deploy-on-merge');
            console.log(`Source PR has deploy-on-merge label: ${hasDeployLabel}`);
            core.setOutput('has_deploy_label', hasDeployLabel);

      - name: Notify (no deploy label)
        if: steps.find-pr.outputs.pr_number && steps.check-label.outputs.has_deploy_label != 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DATA_REPO_TOKEN }}
          script: |
            const websitePRNumber = ${{ steps.find-pr.outputs.pr_number }};
            const sourcePRNumber = ${{ env.SOURCE_PR }};
            
            await github.rest.issues.createComment({
              owner: '${{ env.DATA_REPO }}'.split('/')[0],
              repo: '${{ env.DATA_REPO }}'.split('/')[1],
              issue_number: sourcePRNumber,
              body: '✅ **Source PR Merged**\n\nThe data has been updated. The corresponding Website PR is ready:\n[TVLSI/website#' + websitePRNumber + '](https://github.com/TVLSI/website/pull/' + websitePRNumber + ')\n\n> **Note:** No deployment was triggered. Use `/deploy` command on the Website PR to deploy to production.'
            });

      - name: Notify deployment starting (with deploy label)
        if: steps.find-pr.outputs.pr_number && steps.check-label.outputs.has_deploy_label == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DATA_REPO_TOKEN }}
          script: |
            const websitePRNumber = ${{ steps.find-pr.outputs.pr_number }};
            const sourcePRNumber = ${{ env.SOURCE_PR }};
            
            await github.rest.issues.createComment({
              owner: '${{ env.DATA_REPO }}'.split('/')[0],
              repo: '${{ env.DATA_REPO }}'.split('/')[1],
              issue_number: sourcePRNumber,
              body: '🚀 **Triggering Production Deployment**\n\nThe source PR had the `deploy-on-merge` label. Starting production deployment...\n\n**Website PR:** [TVLSI/website#' + websitePRNumber + '](https://github.com/TVLSI/website/pull/' + websitePRNumber + ')\n\n> Deployment will build the site with fresh data and deploy via SFTP.\n> The Website PR will be merged automatically after successful deployment.'
            });

  # Trigger production deployment if source PR had deploy label
  trigger-deploy:
    runs-on: ubuntu-latest
    needs: handle-merge
    if: needs.handle-merge.outputs.has_deploy_label == 'true' && needs.handle-merge.outputs.pr_number != ''
    
    steps:
      - name: Trigger deploy-production workflow
        uses: actions/github-script@v7
        with:
          script: |
            console.log('Dispatching deploy-production event...');
            console.log('Website PR: #' + '${{ needs.handle-merge.outputs.pr_number }}');
            console.log('PR Branch: ' + '${{ needs.handle-merge.outputs.pr_branch }}');
            console.log('Source PR: #' + '${{ env.SOURCE_PR }}');
            
            await github.rest.repos.createDispatchEvent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              event_type: 'deploy-production',
              client_payload: {
                source_pr: ${{ env.SOURCE_PR }},
                pr_title: ${{ toJson(github.event.client_payload.pr_title) }},
                sender: '${{ github.event.client_payload.sender }}',
                website_pr: ${{ needs.handle-merge.outputs.pr_number }},
                pr_branch: '${{ needs.handle-merge.outputs.pr_branch }}'
              }
            });
            console.log('✓ Dispatched deploy-production event');


  # Handle PR closed without merge - cleanup
  handle-close:
    runs-on: ubuntu-latest
    needs: log-event
    if: github.event.client_payload.action == 'closed'
    
    steps:
      - name: Close corresponding PR and delete branch
        uses: actions/github-script@v7
        with:
          script: |
            const targetBranch = 'data/${{ github.event.client_payload.branch }}';
            
            // Find and close the PR
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${targetBranch}`,
              state: 'open'
            });
            
            for (const pr of prs) {
              console.log(`Closing PR #${pr.number}`);
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `🚫 **Closed**\n\nThe source PR in website-data was closed without merging.`
              });
              
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                state: 'closed'
              });
            }
            
            // Delete the branch
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${targetBranch}`
              });
              console.log(`Deleted branch ${targetBranch}`);
            } catch (e) {
              console.log(`Could not delete branch: ${e.message}`);
            }

      - name: Comment on source PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DATA_REPO_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: '${{ env.DATA_REPO }}'.split('/')[0],
              repo: '${{ env.DATA_REPO }}'.split('/')[1],
              issue_number: ${{ env.SOURCE_PR }},
              body: `🧹 **Website PR Cleaned Up**\n\nThe corresponding Website branch and PR have been closed and deleted.`
            });
