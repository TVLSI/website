# Data Sync from website-data Repository
#
# This workflow receives dispatch events from website-data when PRs with
# data changes are created, updated, or closed. It creates/updates a
# corresponding branch and PR in this repository.
#
# See website-data/docs/AUTOMATION.md for full documentation.

name: Data Sync

on:
  repository_dispatch:
    types: [data-pr-sync]

env:
  DATA_REPO: TVLSI/website-data
  DATA_BRANCH: ${{ github.event.client_payload.branch }}
  SOURCE_PR: ${{ github.event.client_payload.pr_number }}
  TARGET_BRANCH: data/${{ github.event.client_payload.branch }}

jobs:
  # Handle PR opened or updated - create/update branch and PR
  sync-pr:
    runs-on: ubuntu-latest
    if: github.event.client_payload.action == 'opened' || github.event.client_payload.action == 'updated'
    
    steps:
      - name: Checkout Website repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create or checkout target branch
        run: |
          # Check if branch exists remotely
          if git ls-remote --exit-code --heads origin ${{ env.TARGET_BRANCH }}; then
            echo "Branch exists, checking out"
            git fetch origin ${{ env.TARGET_BRANCH }}
            git checkout ${{ env.TARGET_BRANCH }}
            git reset --hard origin/main
          else
            echo "Creating new branch from main"
            git checkout -b ${{ env.TARGET_BRANCH }}
          fi

      - name: Clone website-data repository
        run: |
          git clone --depth 1 --branch ${{ env.DATA_BRANCH }} \
            https://x-access-token:${{ secrets.DATA_REPO_TOKEN }}@github.com/${{ env.DATA_REPO }}.git \
            /tmp/website-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f /tmp/website-data/requirements.txt ]; then
            pip install -r /tmp/website-data/requirements.txt
          fi

      - name: Run data generation scripts
        working-directory: /tmp/website-data
        run: |
          echo "Running data generation scripts..."
          
          # Always run all scripts to ensure generated-data is complete
          # The scripts are idempotent and will only update what's needed
          
          echo "=== Running update_eb.py ==="
          python scripts/update_eb.py || echo "update_eb.py completed (may have warnings)"
          
          echo "=== Running create_downloads_file.py ==="
          python scripts/create_downloads_file.py || echo "create_downloads_file.py completed (may have warnings)"
          
          echo "=== Running update_issues.py (with empty input) ==="
          # update_issues.py expects stdin input for new issues
          # For sync, we just regenerate from existing source data
          echo '[]' | python scripts/update_issues.py || echo "update_issues.py completed (may have warnings)"
          
          echo "=== Data generation complete ==="

      - name: Copy generated data to Website
        run: |
          # Ensure data directory exists
          mkdir -p data
          mkdir -p assets/images/eb
          
          # Copy JSON files from generated-data
          echo "Copying JSON files..."
          cp -v /tmp/website-data/generated-data/*.json data/ 2>/dev/null || echo "No JSON files to copy"
          
          # Copy EB images from generated-data/images/eb
          echo "Copying EB images..."
          if [ -d "/tmp/website-data/generated-data/images/eb" ]; then
            cp -v /tmp/website-data/generated-data/images/eb/* assets/images/eb/ 2>/dev/null || echo "No images to copy"
          fi
          
          echo "=== Files copied ==="
          ls -la data/
          ls -la assets/images/eb/ 2>/dev/null || echo "No EB images directory"

      - name: Commit changes
        id: commit
        run: |
          git add data/
          git add assets/images/eb/
          
          if git diff --staged --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "Sync data from website-data PR #${{ env.SOURCE_PR }}"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: Push branch
        if: steps.commit.outputs.has_changes == 'true'
        run: |
          git push -u origin ${{ env.TARGET_BRANCH }} --force

      - name: Check for existing PR
        id: check-pr
        uses: actions/github-script@v7
        with:
          script: |
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${{ env.TARGET_BRANCH }}`,
              state: 'open'
            });
            
            if (prs.length > 0) {
              console.log(`Found existing PR: #${prs[0].number}`);
              return { exists: true, number: prs[0].number };
            }
            console.log('No existing PR found');
            return { exists: false, number: null };
          result-encoding: json

      - name: Create PR if needed
        id: create-pr
        if: steps.commit.outputs.has_changes == 'true' && fromJson(steps.check-pr.outputs.result).exists == false
        uses: actions/github-script@v7
        with:
          script: |
            const pr = await github.rest.pulls.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Data: ${{ github.event.client_payload.pr_title }}`,
              body: `This PR syncs data changes from [website-data PR #${{ env.SOURCE_PR }}](https://github.com/${{ env.DATA_REPO }}/pull/${{ env.SOURCE_PR }}).
            
            ---
            
            **Source:** \`${{ env.DATA_REPO }}\` branch \`${{ env.DATA_BRANCH }}\`
            **Triggered by:** @${{ github.event.client_payload.sender }}
            
            > ⚠️ **Do not merge this PR directly.** Merge the source PR in website-data instead.
            > This PR will be automatically merged when the source PR is merged.
            
            ---
            
            ### Commands (on website-data PR)
            - \`/preview\` - Deploy to GitHub Pages for review
            - \`/deploy\` - Mark for production deployment on merge
            `,
              head: '${{ env.TARGET_BRANCH }}',
              base: 'main'
            });
            
            console.log(`Created PR #${pr.data.number}`);
            return pr.data.number;

      - name: Get PR number
        id: get-pr-number
        run: |
          if [ "${{ fromJson(steps.check-pr.outputs.result).exists }}" == "true" ]; then
            echo "pr_number=${{ fromJson(steps.check-pr.outputs.result).number }}" >> $GITHUB_OUTPUT
          else
            echo "pr_number=${{ steps.create-pr.outputs.result }}" >> $GITHUB_OUTPUT
          fi

      - name: Comment on source PR
        if: steps.commit.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DATA_REPO_TOKEN }}
          script: |
            const prNumber = '${{ steps.get-pr-number.outputs.pr_number }}';
            const action = '${{ github.event.client_payload.action }}';
            const isNew = action === 'opened';
            
            const body = isNew 
              ? `🔗 **Website PR Created**
            
            A corresponding PR has been created in the Website repository:
            **[TVLSI/website#${prNumber}](https://github.com/TVLSI/website/pull/${prNumber})**
            
            ### Next Steps
            - Comment \`/preview\` to deploy a preview to GitHub Pages
            - Comment \`/deploy\` to mark for production deployment
            - Merge this PR to trigger auto-merge of the Website PR`
              : `🔄 **Website PR Updated**
            
            The Website PR has been updated with your latest changes:
            **[TVLSI/website#${prNumber}](https://github.com/TVLSI/website/pull/${prNumber})**`;
            
            await github.rest.issues.createComment({
              owner: '${{ env.DATA_REPO }}'.split('/')[0],
              repo: '${{ env.DATA_REPO }}'.split('/')[1],
              issue_number: ${{ env.SOURCE_PR }},
              body: body
            });

  # Handle PR merged - will be implemented in Phase 3
  handle-merge:
    runs-on: ubuntu-latest
    if: github.event.client_payload.action == 'merged'
    
    steps:
      - name: Log merge event
        run: |
          echo "PR #${{ env.SOURCE_PR }} was merged"
          echo "This will trigger auto-merge in Phase 3"
          # Phase 3 implementation will go here

  # Handle PR closed without merge - cleanup
  handle-close:
    runs-on: ubuntu-latest
    if: github.event.client_payload.action == 'closed'
    
    steps:
      - name: Close corresponding PR and delete branch
        uses: actions/github-script@v7
        with:
          script: |
            const targetBranch = 'data/${{ github.event.client_payload.branch }}';
            
            // Find and close the PR
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${targetBranch}`,
              state: 'open'
            });
            
            for (const pr of prs) {
              console.log(`Closing PR #${pr.number}`);
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `🚫 **Closed**\n\nThe source PR in website-data was closed without merging.`
              });
              
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                state: 'closed'
              });
            }
            
            // Delete the branch
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${targetBranch}`
              });
              console.log(`Deleted branch ${targetBranch}`);
            } catch (e) {
              console.log(`Could not delete branch: ${e.message}`);
            }

      - name: Comment on source PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.DATA_REPO_TOKEN }}
          script: |
            await github.rest.issues.createComment({
              owner: '${{ env.DATA_REPO }}'.split('/')[0],
              repo: '${{ env.DATA_REPO }}'.split('/')[1],
              issue_number: ${{ env.SOURCE_PR }},
              body: `🧹 **Website PR Cleaned Up**\n\nThe corresponding Website branch and PR have been closed and deleted.`
            });
