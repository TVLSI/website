# Deploy to Production via SFTP
#
# This workflow deploys the website to production when:
# 1. Explicitly triggered via repository_dispatch from data-sync (reliable)
# 2. Manual workflow_dispatch with force_deploy option
#
# See website-data/docs/AUTOMATION.md for full documentation.
#
# Required secrets:
#   DATA_REPO_TOKEN - PAT with repo access to TVLSI/website-data
#   SFTP_HOST       - Production server hostname
#   SFTP_USERNAME   - SFTP login username
#   SFTP_PASSWORD   - SFTP login password
#   SFTP_PATH       - Remote directory path
#   SFTP_PORT       - (Optional) SFTP port, defaults to 22

name: Deploy Production

run-name: "${{ github.event_name == 'repository_dispatch' && format('Deploy #{0}: {1}', github.event.client_payload.source_pr, github.event.client_payload.pr_title) || 'Deploy Production (Manual)' }}"

on:
  # Triggered by data-sync workflow after merge with deploy label
  repository_dispatch:
    types: [deploy-production]
  # Allow manual retry after fixing issues (e.g., SFTP permissions)
  workflow_dispatch:
    inputs:
      website_pr:
        description: 'Website PR number to deploy (leave empty to deploy main)'
        required: false
        type: string
      source_pr:
        description: 'Original website-data PR number (for reference)'
        required: false
        type: string

# Grant necessary permissions
permissions:
  contents: write
  pull-requests: write

env:
  DATA_REPO: TVLSI/website-data

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Get PR information (for manual dispatch)
        if: github.event_name == 'workflow_dispatch' && inputs.website_pr != ''
        id: pr_info
        uses: actions/github-script@v9
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: parseInt('${{ inputs.website_pr }}')
            });
            core.setOutput('pr_branch', pr.head.ref);
            core.setOutput('pr_title', pr.title);
            console.log(`PR #${pr.number}: ${pr.title}`);
            console.log(`Branch: ${pr.head.ref}`);

      - name: Log deployment info
        run: |
          echo "=== Production Deployment ==="
          echo "Triggered by: ${{ github.event_name }}"
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "Source PR: #${{ github.event.client_payload.source_pr }}"
            echo "Website PR: #${{ github.event.client_payload.website_pr }}"
            echo "PR Branch: ${{ github.event.client_payload.pr_branch }}"
            echo "PR Title: ${{ github.event.client_payload.pr_title }}"
            echo "Triggered by: ${{ github.event.client_payload.sender }}"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "Manual retry triggered"
            if [ -n "${{ inputs.website_pr }}" ]; then
              echo "Website PR: #${{ inputs.website_pr }}"
              echo "PR Branch: ${{ steps.pr_info.outputs.pr_branch }}"
              echo "PR Title: ${{ steps.pr_info.outputs.pr_title }}"
            fi
            if [ -n "${{ inputs.source_pr }}" ]; then
              echo "Source PR: #${{ inputs.source_pr }}"
            fi
          fi
          echo "============================="

      - name: Checkout Website PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.pr_branch || (github.event_name == 'workflow_dispatch' && steps.pr_info.outputs.pr_branch || 'main') }}

      - name: Clone website-data main branch
        run: |
          git clone --depth 1 --branch main \
            https://x-access-token:${{ secrets.DATA_REPO_TOKEN }}@github.com/${{ env.DATA_REPO }}.git \
            website-data
          echo "✓ Cloned website-data main branch"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          cd website-data
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
            echo "✓ Installed Python dependencies"
          fi

      - name: Run data generation scripts
        run: |
          cd website-data
          
          # Run update_eb.py to process member data
          if [ -f scripts/update_eb.py ]; then
            echo "Running update_eb.py..."
            python scripts/update_eb.py || { echo "ERROR: update_eb.py failed"; exit 1; }
            echo "✓ Completed update_eb.py"
          else
            echo "ERROR: scripts/update_eb.py not found"
            exit 1
          fi
          
          # Run create_downloads_file.py to process downloads data
          if [ -f scripts/create_downloads_file.py ]; then
            echo "Running create_downloads_file.py..."
            python scripts/create_downloads_file.py || { echo "ERROR: create_downloads_file.py failed"; exit 1; }
            echo "✓ Completed create_downloads_file.py"
          else
            echo "ERROR: scripts/create_downloads_file.py not found"
            exit 1
          fi
          
          echo "✓ All generation scripts completed"
          echo ""
          echo "Generated files:"
          ls -lh generated-data/*.json || echo "No JSON files found in generated-data/"

      - name: Copy generated data to Website
        run: |
          # Ensure generated-data directory exists and has files
          if [ ! -d "website-data/generated-data" ]; then
            echo "::error::website-data/generated-data directory not found!"
            exit 1
          fi
          
          # Copy JSON files
          mkdir -p data
          cp website-data/generated-data/*.json data/ || { echo "::error::Failed to copy JSON files"; exit 1; }
          echo "✓ Copied JSON files"
          
          echo "Files in data/ directory:"
          ls -lh data/*.json
          
          # Copy member images
          mkdir -p assets/images/eb
          if [ -d website-data/generated-data/images/eb ]; then
            cp -r website-data/generated-data/images/eb/* assets/images/eb/
            echo "✓ Copied member images"
          else
            echo "Warning: No member images found in website-data/generated-data/images/eb"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Build with Eleventy
        run: |
          npx eleventy
          echo "✓ Site built successfully"

      - name: Install lftp for SFTP deployment
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Count local site files
        id: count_files
        run: |
          FILE_COUNT=$(find _site -type f | wc -l | tr -d ' ')
          echo "Local files to upload: ${FILE_COUNT}"
          echo "file_count=${FILE_COUNT}" >> $GITHUB_OUTPUT

      - name: Deploy to production via SFTP
        id: sftp_deploy
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_PATH: ${{ secrets.SFTP_PATH }}
        run: |
          # Use port 22 if SFTP_PORT is not set
          PORT="${SFTP_PORT:-22}"
          
          echo "Deploying to ${SFTP_HOST}:${PORT}${SFTP_PATH}"
          START_TS=$(date +%s)
          
          # --delete removes remote files that don't exist locally
          # --no-perms disables chmod attempts (avoids permission denied errors)
          # --verbose for detailed logging
          lftp -u "${SFTP_USERNAME},${SFTP_PASSWORD}" \
            -e "set sftp:auto-confirm yes; set ssl:verify-certificate no; mirror -R --verbose --delete --no-perms --no-umask ./_site/ ${SFTP_PATH}; quit" \
            sftp://${SFTP_HOST}:${PORT}
          
          if [ $? -ne 0 ]; then
            echo "::error::SFTP upload failed. Check server permissions for ${SFTP_PATH}"
            exit 1
          fi
          
          END_TS=$(date +%s)
          DURATION=$((END_TS-START_TS))
          echo "✓ SFTP deployment complete in ${DURATION}s"
          echo "duration=${DURATION}" >> $GITHUB_OUTPUT
          echo "host=${SFTP_HOST}" >> $GITHUB_OUTPUT
          echo "port=${PORT}" >> $GITHUB_OUTPUT
          echo "path=${SFTP_PATH}" >> $GITHUB_OUTPUT

      - name: Write deployment summary
        run: |
          echo "## Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Host:** ${{ steps.sftp_deploy.outputs.host }}:${{ steps.sftp_deploy.outputs.port }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Path:** ${{ steps.sftp_deploy.outputs.path }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Files Uploaded:** ${{ steps.count_files.outputs.file_count }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Duration:** ${{ steps.sftp_deploy.outputs.duration }}s" >> $GITHUB_STEP_SUMMARY
          echo "- **Run ID:** $GITHUB_RUN_ID" >> $GITHUB_STEP_SUMMARY
          echo "- **Started By:** ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.sender || github.actor }}" >> $GITHUB_STEP_SUMMARY

      # After successful deploy, merge the Website PR and delete branch (auto mode only)
      - name: Merge Website PR after successful deploy
        if: |
          github.event_name == 'repository_dispatch' && 
          github.event.client_payload.website_pr != null &&
          github.event.client_payload.website_pr != ''
        uses: actions/github-script@v9
        with:
          script: |
            const websitePR = ${{ github.event.client_payload.website_pr }};
            const sourcePR = ${{ github.event.client_payload.source_pr }};
            
            try {
              await github.rest.pulls.merge({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: websitePR,
                merge_method: 'squash',
                commit_title: `Merge data from website-data PR #${sourcePR}`
              });
              console.log(`✓ Merged Website PR #${websitePR} after successful deployment`);
            } catch (e) {
              console.log(`Failed to merge PR: ${e.message}`);
              core.setFailed('Deployment succeeded but PR merge failed');
            }

      - name: Delete Website PR branch after merge
        if: |
          github.event_name == 'repository_dispatch' && 
          github.event.client_payload.pr_branch != null &&
          github.event.client_payload.pr_branch != ''
        uses: actions/github-script@v9
        continue-on-error: true
        with:
          script: |
            const branchName = '${{ github.event.client_payload.pr_branch }}';
            
            try {
              await github.rest.git.deleteRef({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: `heads/${branchName}`
              });
              console.log(`✓ Deleted branch ${branchName}`);
            } catch (e) {
              console.log(`Could not delete branch: ${e.message}`);
            }

      - name: Comment on source PR (auto mode)
        if: github.event_name == 'repository_dispatch'
        uses: actions/github-script@v9
        continue-on-error: true
        with:
          github-token: ${{ secrets.DATA_REPO_TOKEN }}
          script: |
            const sourcePR = ${{ github.event.client_payload.source_pr }};
            const [dataOwner, dataRepo] = '${{ env.DATA_REPO }}'.split('/');
            const host = '${{ steps.sftp_deploy.outputs.host }}';
            const port = '${{ steps.sftp_deploy.outputs.port }}';
            const path = '${{ steps.sftp_deploy.outputs.path }}';
            const files = '${{ steps.count_files.outputs.file_count }}';
            const duration = '${{ steps.sftp_deploy.outputs.duration }}';
            const websitePr = ${{ github.event.client_payload.website_pr || 0 }};
            const prTitle = ${{ toJson(github.event.client_payload.pr_title) }};
            
            await github.rest.issues.createComment({
              owner: dataOwner,
              repo: dataRepo,
              issue_number: sourcePR,
              body: `✅ **Production Deployment Complete**\n\n**Uploaded:** ${files} files\n**Target:** ${host}:${port}${path}\n**Duration:** ${duration}s\n**Completed at:** ${new Date().toISOString()}\n\n${websitePr ? `**Website PR #${websitePr} has been merged** ✓\n\n` : ''}**Workflow Run:** https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}${prTitle ? `\n**Title:** ${prTitle}` : ''}`
            });

      - name: Comment on Website PR (manual retry mode)
        if: github.event_name == 'workflow_dispatch' && inputs.website_pr != ''
        uses: actions/github-script@v9
        continue-on-error: true
        with:
          script: |
            const websitePR = parseInt('${{ inputs.website_pr }}');
            const host = '${{ steps.sftp_deploy.outputs.host }}';
            const port = '${{ steps.sftp_deploy.outputs.port }}';
            const path = '${{ steps.sftp_deploy.outputs.path }}';
            const files = '${{ steps.count_files.outputs.file_count }}';
            const duration = '${{ steps.sftp_deploy.outputs.duration }}';
            
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: websitePR,
              body: `✅ **Manual Deployment Retry Successful**\n\n**Uploaded:** ${files} files\n**Target:** ${host}:${port}${path}\n**Duration:** ${duration}s\n**Completed at:** ${new Date().toISOString()}\n\n**Workflow Run:** https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}\n\n*You can now manually merge this PR if desired.*`
            });

      - name: Handle deployment failure
        if: failure()
        uses: actions/github-script@v9
        continue-on-error: true
        env:
          GITHUB_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        with:
          github-token: ${{ secrets.DATA_REPO_TOKEN }}
          script: |
            const eventName = '${{ github.event_name }}';
            const githubRepo = process.env.GITHUB_REPO;
            const runId = process.env.RUN_ID;
            
            if (eventName === 'repository_dispatch') {
              const sourcePR = ${{ github.event.client_payload.source_pr || 0 }};
              const websitePR = ${{ github.event.client_payload.website_pr || 0 }};
              if (!sourcePR) return;
              
              const [dataOwner, dataRepo] = '${{ env.DATA_REPO }}'.split('/');
              const host = '${{ steps.sftp_deploy.outputs.host }}';
              const port = '${{ steps.sftp_deploy.outputs.port }}';
              const path = '${{ steps.sftp_deploy.outputs.path }}';
              
              // Reopen website-data PR
              try {
                await github.rest.pulls.update({
                  owner: dataOwner,
                  repo: dataRepo,
                  pull_number: sourcePR,
                  state: 'open'
                });
                console.log(`✓ Reopened website-data PR #${sourcePR}`);
              } catch (e) {
                console.log(`Could not reopen website-data PR: ${e.message}`);
              }
              
              // Reopen Website PR
              if (websitePR) {
                try {
                  await github.rest.pulls.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    pull_number: websitePR,
                    state: 'open'
                  });
                  console.log(`✓ Reopened Website PR #${websitePR}`);
                } catch (e) {
                  console.log(`Could not reopen Website PR: ${e.message}`);
                }
              }
              
              // Comment on source PR (website-data)
              try {
                await github.rest.issues.createComment({
                  owner: dataOwner,
                  repo: dataRepo,
                  issue_number: sourcePR,
                  body: `❌ **Production Deployment Failed**\n\n**Target:** ${host}:${port}${path}\n\n⚠️ **Both PRs have been reopened** for investigation.\n\n**To retry after fixing the issue:**\n1. Fix the underlying problem (e.g., SFTP permissions)\n2. Go to: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/deploy-production.yml\n3. Click "Run workflow"\n4. Enter Website PR number: **${websitePR}**\n5. (Optional) Enter this PR number for comments: **${sourcePR}**\n6. Click "Run workflow"\n\n**Logs:** [View Deployment Logs](https://github.com/${githubRepo}/actions/runs/${runId})\n\n${websitePR ? `**Website PR:** https://github.com/${context.repo.owner}/${context.repo.repo}/pull/${websitePR}` : ''}`
                });
              } catch (e) {
                console.log(`Could not comment on source PR: ${e.message}`);
              }
              
              // ALSO comment on Website PR (where user is waiting)
              if (websitePR) {
                try {
                  await github.rest.issues.createComment({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: websitePR,
                    body: `❌ **Production Deployment Failed**\n\n**Error:** SFTP permission denied on multiple files.\n\n**Root Cause:** The SFTP server is rejecting file uploads. This is typically a server-side permission issue, NOT a code issue.\n\n**What needs to be fixed:**\n1. Check SFTP server file permissions\n2. Ensure the SFTP user has write access to the remote directory\n3. Contact the server administrator if needed\n\n**To retry after fixing:**\n1. Go to: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/deploy-production.yml\n2. Click "Run workflow"\n3. Enter Website PR number: **${websitePR}**\n4. Click "Run workflow"\n\n**Logs:** [View Full Deployment Logs](https://github.com/${githubRepo}/actions/runs/${runId})\n\n**Source PR:** https://github.com/${dataOwner}/${dataRepo}/pull/${sourcePR}`
                  });
                  console.log(`✓ Posted failure comment to Website PR #${websitePR}`);
                } catch (e) {
                  console.log(`Could not comment on Website PR: ${e.message}`);
                }
              }
            } else if (eventName === 'workflow_dispatch') {
              // Manual retry failed
              const websitePR = '${{ inputs.website_pr }}';
              if (!websitePR) return;
              
              const host = '${{ steps.sftp_deploy.outputs.host }}' || '${{ secrets.SFTP_HOST }}';
              const port = '${{ steps.sftp_deploy.outputs.port }}' || '${{ secrets.SFTP_PORT }}' || '22';
              const path = '${{ steps.sftp_deploy.outputs.path }}' || '${{ secrets.SFTP_PATH }}';
              
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: parseInt(websitePR),
                body: `❌ **Manual Deployment Retry Failed**\n\n**Target:** ${host}:${port}${path}\n\n**What went wrong:**\nThe deployment build or SFTP upload failed. Common causes:\n- SFTP server unavailable or credentials incorrect\n- SFTP permission denied on remote path\n- Build failed due to missing data or template errors\n\n**How to fix:**\n1. Check the error logs below to identify the specific issue\n2. Fix SFTP server/permissions if it's an upload error\n3. Fix data/template issues if it's a build error\n\n**What to do next:**\nOnce you've fixed the issue, retry deployment:\n1. Go to: https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/deploy-production.yml\n2. Click "Run workflow"\n3. Enter Website PR number: **${websitePR}**\n4. Click "Run workflow"\n\nOr merge this PR without deploying:\n1. Remove the \`deploy-on-merge\` label\n2. Merge the PR manually\n\n**Logs:** [View Deployment Logs](https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`
              });
            }

